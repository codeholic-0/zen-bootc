name: ZenC OS Image Publish

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "policy.json"
      - "files/**"
      - "build_scripts/**"
      - ".github/workflows/bootc-publish.yaml"
      - ".github/scripts/**"
      - "cosign.pub"
      - "registries.d/**"
  # Weekly rebuild: tracks Fedora 45 package/base updates without any commits.
  # 18:05 UTC Saturday (off-peak offset from the hour).
  schedule:
    - cron: "5 18 * * 6"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zen-bootc
  # Distro-agnostic rechunker; pinned by digest, bump deliberately.
  RECHUNK_IMAGE: quay.io/coreos/chunkah@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523

# Superseded runs die.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    name: Build OS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        # Rechunking copies the full image; prune the runner first.
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Install podman
        # 24.04 runners normally ship Podman; only install when missing.
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR
        # Built-in GITHUB_TOKEN, no PAT.
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          IMAGE="${IMAGE,,}"
          # --pull=newer is what makes the weekly schedule track base updates.
          podman build --pull=newer -f Containerfile -t "$IMAGE:latest" .
          # Immutable rollback anchor: latest-<UTC date>-<commit sha7>.
          echo "DTAG=$IMAGE:latest-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Rechunk image (small delta updates)
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "$RUNNER_TEMP"/zen-bootc-chunkah-XXXXXX)"
          podman inspect "$IMAGE:latest" > "$CHUNKAH_CONFIG_FILE"

          podman run --rm \
            --mount=type=image,src="$IMAGE:latest",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 256 \
            --prune /sysroot/ \
            --prune /run/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          # Re-point both local tags onto the chunked image.
          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:latest" || true
          podman tag "$CHUNKED_IMAGE" "$IMAGE:latest" "$DTAG"

      - name: Smoke-check image
        # Runs the final chunked image (the artifact that gets pushed+signed)
        # and asserts branding, zen-ctl wiring, signature policy and toolchain
        # invariants. Checks live in .github/scripts/smoke.sh and are fed on
        # stdin so they are not baked into the image.
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          podman run --rm -i "$IMAGE:latest" /bin/bash -s < .github/scripts/smoke.sh

      - name: Push staging image (unsigned, not user-facing)
        # Stage the exact image that will be published, sign its digest, and
        # only then move the production tags. A cancelled/failed run therefore
        # never leaves an unsigned :latest or dated anchor behind.
        # staging-latest is a fixed alias, overwritten on every run; old
        # digests become untagged and are removed by the weekly GHCR cleanup.
        run: |
          IMAGE="${IMAGE,,}"
          STAGING="$IMAGE:staging-latest"
          podman tag "$IMAGE:latest" "$STAGING"
          # First push uploads fresh blobs but DROPS chunkah layer
          # annotations (podman #27796) -> digest differs. The second push
          # converges onto the annotated digest; sign THAT digest.
          podman push "$STAGING"
          podman push --digestfile=/tmp/digestfile "$STAGING"

      - name: Log in to GHCR (docker client, for cosign)
        # cosign uses its own credential chain, not podman's authfile.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          # Sign the staged digest before any production tag is moved.
          # Keep the old bundle flags: bootc/rpm-ostree need that format.
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"

      - name: Push production tags (already signed)
        run: |
          IMAGE="${IMAGE,,}"
          for ref in "$IMAGE:latest" "$DTAG"; do
            podman push "$ref"
            podman push --digestfile=/tmp/prod-digestfile "$ref"
          done

      - name: Verify signature (self-check)
        # Verify BY TAG: each tag's registry digest must be the signed one
        # (podman #27796 class of divergence). No Rekor entry on key-based
        # signs, hence --insecure-ignore-tlog.
        run: |
          IMAGE="${IMAGE,,}"
          for ref in "$IMAGE:latest" "$DTAG"; do
            cosign verify --key cosign.pub --insecure-ignore-tlog "$ref"
          done
