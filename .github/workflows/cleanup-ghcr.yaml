name: GHCR Cleanup

on:
  # Sunday 18:05 UTC — day after the Saturday image build, so cleanup
  # never races a rebuild.
  schedule:
    - cron: "5 18 * * 0"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview cleanup without deleting anything"
        type: boolean
        required: true
        default: true

permissions:
  packages: write
  actions: write

concurrency:
  group: ghcr-cleanup-zen-bootc
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retain latest images
    runs-on: ubuntu-latest

    steps:
      # Keep the rolling :latest tag + 5 dated rollback anchors.
      # Legacy stable/testing/dev/minimal tags are deliberately left alone.
      - name: Retain latest images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-tags: '^latest-[0-9]{8}-[0-9a-f]{7}$'
          use-regex: true
          keep-n-tagged: 5
          exclude-tags: '^latest$'
          delete-untagged: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      # Remove stale untagged images and orphaned Cosign artifacts.
      - name: Remove untagged and orphaned images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-untagged: true
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
