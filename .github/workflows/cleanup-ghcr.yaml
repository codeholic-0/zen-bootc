
name: GHCR Cleanup

on:
  # Run after the Saturday image builds.
  schedule:
    - cron: "5 18 * * 0"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview cleanup without deleting anything"
        type: boolean
        required: true
        default: true

permissions:
  packages: write
  actions: write

concurrency:
  group: ghcr-cleanup-zen-bootc
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retain latest images
    runs-on: ubuntu-latest

    steps:
      # Keep the active stable image + 5 rollbacks.
      - name: Retain stable images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-tags: '^stable-[0-9]{8}-[0-9a-f]{7}$'
          use-regex: true
          keep-n-tagged: 6
          exclude-tags: '^(stable|latest|testing|dev|minimal-latest)$'
          delete-untagged: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      # Keep the active testing image + 2 rollbacks.
      - name: Retain testing images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-tags: '^testing-[0-9]{8}-[0-9a-f]{7}$'
          use-regex: true
          keep-n-tagged: 3
          exclude-tags: '^(stable|latest|testing|dev|minimal-latest)$'
          delete-untagged: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      # Keep the active dev image + 5 rollbacks.
      - name: Retain dev images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-tags: '^dev-[0-9]{8}-[0-9a-f]{7}$'
          use-regex: true
          keep-n-tagged: 6
          exclude-tags: '^(stable|latest|testing|dev|minimal-latest)$'
          delete-untagged: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      # Keep the active minimal image + 2 rollbacks.
      - name: Retain minimal images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-tags: '^minimal-[0-9]{8}-[0-9a-f]{7}$'
          use-regex: true
          keep-n-tagged: 3
          exclude-tags: '^(stable|latest|testing|dev|minimal-latest)$'
          delete-untagged: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      # Remove stale untagged images and orphaned Cosign artifacts.
      - name: Remove untagged and orphaned images
        uses: dataaxiom/ghcr-cleanup-action@f092b48ba3b604b2a83690dc4b2bbb3392e1045f
        with:
          owner: codeholic-0
          package: zen-bootc
          delete-untagged: true
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
